# ==============================================================================
# A股动态仓位管理系统主配置文件
# ==============================================================================

# ==============================================================================
# 1. Tushare API 配置
# ==============================================================================
tushare:
  token: "eb255d8d5558f567f58a652391d7f9eb620d00fab51759e15014805ebbf2"
  http_url: "https://jiaoch.site"
  timeout: 30
  retry: 3
  rate_limit: 200

# ==============================================================================
# 2. 路径配置
# ==============================================================================
paths:
  project_root: "."
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_meta: "data/meta"
  figures: "figures"
  reports: "reports"
  logs: "logs"

# ==============================================================================
# 3. 数据更新配置
# ==============================================================================
data:
  start_date: "2010-01-01"
  end_date: "auto"
  
  download:
    daily: true
    daily_basic: true
    fina_indicator: true
    income: true
    balancesheet: true
    cashflow: true
    stock_basic: true
    trade_calendar: true
    industry: true
    macro_gdp: true
    macro_cpi: true
    macro_ppi: true
    macro_shibor: true
    index_daily: true
  
  download_settings:
    delay: 0.1
    batch_size: 100
    retry_failed: true
    parallel_workers: 30
  
  index_list:
    - "000001.SH"
    - "000300.SH"
    - "000905.SH"
    - "399001.SZ"
    - "399006.SZ"
  
  stock_pool:
    exclude_st: true
    exclude_kcb: true
    exclude_bj: true
    min_market_cap: 3000000000
    min_list_days: 365

# ==============================================================================
# 4. 偏移率计算配置
# ==============================================================================
deviation:
  window:
    type: "simple"
    size: 252

  normalization:
    method: "zscore"

  percentile_window: 1260

# ==============================================================================
# 5. 分布分析配置
# ==============================================================================
distribution:
  stats_window: 252

  histogram:
    n_bins: 50
    density: true

  thresholds:
    skewness: 0.5
    kurtosis: 3.5
    jb_pvalue: 0.05

# ==============================================================================
# 6. 网格划分配置
# ==============================================================================
grid:
  n_zones: 10
  type_selection: "adaptive"

  range:
    multiplier: 3.0
    min_range: 0.05

  smoothing:
    enabled: true
    factor: 0.5

  update_frequency: "monthly"

# ==============================================================================
# 7. 仓位配置
# ==============================================================================
position:
  base_sizer: "risk_parity"
  vol_target: 0.15
  max_single_weight: 0.10
  max_industry_weight: 0.25
  max_drawdown: 0.15
  max_position: 1.0
  min_position: 0.0
  max_daily_change: 0.2

  default_mappings:
    normal:
      low_zone: [1, 2, 3]
      high_zone: [8, 9, 10]
    skewed_right:
      low_zone: [1, 2, 3, 4]
      high_zone: [9, 10]
    skewed_left:
      low_zone: [1, 2]
      high_zone: [7, 8, 9, 10]

# ==============================================================================
# 8. 风险控制配置
# ==============================================================================
risk:
  drawdown:
    max_drawdown: 0.15
    stop_loss: 0.20
    recovery_mode: false

  concentration:
    max_single_stock: 0.15
    max_industry: 0.30

  liquidity:
    min_turnover: 1000000
    max_position_ratio: 0.10

# ==============================================================================
# 9. 调仓配置
# ==============================================================================
rebalancing:
  trigger:
    deviation_threshold: 0.02
    position_threshold: 0.05
    time_based: true
    frequency: "weekly"

  method: "smooth"
  smooth_period: 5

# ==============================================================================
# 10. 报告配置
# ==============================================================================
report:
  frequency: "weekly"
  sections:
    - distribution_analysis
    - grid_visualization
    - position_allocation
    - risk_metrics
    - performance_summary

# ==============================================================================
# 11. 回测配置
# ==============================================================================
backtest:
  initial_cash: 1000000
  commission: 0.001
  slippage: 0.001
  stamp_tax: 0.001

# ==============================================================================
# 12. 日志配置
# ==============================================================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  console_enabled: true

# ==============================================================================
# 13. 宏观周期配置
# ==============================================================================
macro_cycle:
  gdp_growth_threshold: 6.0
  cpi_inflation_threshold: 3.0
  
  sector_rotation:
    recovery: ["消费", "金融", "房地产"]
    expansion: ["科技", "周期", "工业"]
    stagflation: ["能源", "原材料", "必选消费"]
    recession: ["公用事业", "医药", "债券"]
